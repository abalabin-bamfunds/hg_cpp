[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=3.1"]
build-backend = "scikit_build_core.build"

[project]
name = "hg-cpp"
version = "0.1.0"
description = "Python bindings for the hg graph engine"
requires-python = ">=3.12"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.scikit-build]
cmake.define.HG_BUILD_PYTHON = "ON"
cmake.define.HG_BUILD_WEB = "ON"
cmake.define.HG_BUNDLE_FMT = "ON"
cmake.define.BUILD_TESTING = "OFF"
cmake.define.CMAKE_INSTALL_LIBDIR = "lib"
wheel.packages = ["bindings/python/python/hgraph", "extensions/web/python/hg_web"]
wheel.py-api = "cp312"
sdist.include = [
  "CMakeLists.txt",
  "bindings/python/CMakeLists.txt",
  "bindings/python/python/**/*.py",
  "bindings/python/src/**",
  "bindings/python/tests/extension_module.cpp",
  "cmake/**",
  "extensions/web/CMakeLists.txt",
  "extensions/web/include/**",
  "extensions/web/python/hg_web/*.py",
  "extensions/web/src/**",
  "include/**",
  "packaging/**",
  "pyproject.toml",
  "src/**",
  "tools/audit_distribution.py",
]
