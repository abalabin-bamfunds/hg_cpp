[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=3.1"]
build-backend = "scikit_build_core.build"

[project]
name = "hg_cpp"
version = "0.1.0"
description = "Python bindings for the bg graph engine"
requires-python = ">=3.12"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.scikit-build]
cmake.define.BG_BUILD_PYTHON = "ON"
cmake.define.BG_BUNDLE_FMT = "ON"
cmake.define.BUILD_TESTING = "OFF"
wheel.packages = ["bindings/python/python/bg"]
wheel.py-api = "cp312"
sdist.include = [
  "CMakeLists.txt",
  "README.md",
  "bindings/python/CMakeLists.txt",
  "bindings/python/python/**",
  "bindings/python/src/**",
  "bindings/python/tests/extension_module.cpp",
  "cmake/**",
  "include/**",
  "packaging/**",
  "pyproject.toml",
  "src/**",
  "tools/audit_distribution.py",
]
