name: Test installed Linux Python wheel

on:
  workflow_call:

permissions:
  actions: read
  contents: read

jobs:
  test:
    name: Test installed CPython 3.13 wheel and SDK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install native runtime and SDK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfmt-dev libicu-dev
          python -m pip install --upgrade --only-binary=:all: "cmake>=3.31" "ninja==1.13.0"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: bg-wheel-linux-cp313
          path: dist
      - name: Audit wheel contents
        run: python tools/audit_wheel.py dist/*.whl
      - name: Install into a temporary isolated environment and run graph smoke
        run: python tools/test_wheel.py dist/*.whl
      - name: Create installed-wheel SDK environment
        run: |
          python -m venv "$RUNNER_TEMP/bg-wheel-tests"
          "$RUNNER_TEMP/bg-wheel-tests/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/bg-wheel-tests/bin/python" -m pip install "nanobind>=3.1"
      - name: Build and run installed C++ SDK consumer
        run: "$RUNNER_TEMP/bg-wheel-tests/bin/python" "$GITHUB_WORKSPACE/tools/test_installed_sdk.py"
