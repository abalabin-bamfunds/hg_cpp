name: Build and test Python wheel artifacts

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  build-linux-wheel:
    uses: ./.github/workflows/build-wheel.yml

  test-linux-wheel:
    needs: build-linux-wheel
    uses: ./.github/workflows/test-wheel.yml
