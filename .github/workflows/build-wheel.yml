name: Build Linux Python wheel

on:
  workflow_call:

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Build CPython 3.13 Linux wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfmt-dev libicu-dev
      - name: Install build tools
        run: >-
          python -m pip install --upgrade --only-binary=:all:
          "build==1.3.0" "auditwheel==6.4.2" "cmake>=3.31" "ninja==1.13.0"
      - name: Build wheel
        env:
          CMAKE_GENERATOR: Ninja
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: python -m build --wheel
      - name: Audit wheel contents
        run: python tools/audit_wheel.py dist/*.whl
      - name: Report external Linux wheel dependencies
        run: auditwheel show dist/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bg-wheel-linux-cp313
          path: dist/*.whl
          if-no-files-found: error
